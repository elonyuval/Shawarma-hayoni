<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="עיוני">
  <!-- אייקון זמני שנגזר מהלוגו: רקע חום־פחם, האות ע בשמנת, והנקודה האדומה.
       כשיהיה קובץ לוגו וקטורי — להחליף את הקובץ הזה. -->
  <rect width="64" height="64" rx="14" fill="#241C17"/>
  <text x="34" y="45" font-family="Heebo, Arial Hebrew, sans-serif" font-size="38"
        font-weight="900" fill="#F3ECE1" text-anchor="middle">ע</text>
  <circle cx="14" cy="40" r="5" fill="#C4382A"/>
</svg>
